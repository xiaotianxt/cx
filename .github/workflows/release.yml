name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy service feature
        run: cargo clippy --all-targets --features service -- -D warnings

      - name: Test
        run: cargo test

      - name: Test service feature
        run: cargo test --features service

      - name: Build
        run: cargo build --release

      - name: Archive
        run: |
          mkdir -p archive
          cp target/release/cx archive/
          cd archive
          tar czf ../cx-${{ github.ref_name }}-darwin-arm64.tar.gz cx

      - uses: actions/upload-artifact@v4
        with:
          name: cx-${{ github.ref_name }}-darwin-arm64
          path: cx-${{ github.ref_name }}-darwin-arm64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cx-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: cx-*.tar.gz
          generate_release_notes: true
