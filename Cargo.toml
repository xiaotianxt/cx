[package]
name = "cx"
version = "0.3.5"
edition = "2021"
description = "Fast local Codex launcher, stdin wrapper, and slot manager"
authors = ["yupeit"]
repository = "https://github.com/xiaotianxt/cx"
license = "MIT"
keywords = ["codex", "openai", "cli", "accounts"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
mio = { version = "1.2", features = ["net", "os-poll"] }
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
signal-hook = "0.3"
toml = "0.8"
