[package]
name = "cx"
version = "0.1.0"
edition = "2021"
description = "Fast local Codex launcher, stdin wrapper, and slot manager"
authors = ["yupeit"]
repository = "https://github.com/xiaotianxt/cx"
license = "MIT"
keywords = ["codex", "openai", "cli", "accounts"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
