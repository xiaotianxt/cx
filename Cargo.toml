[package]
name = "cx"
version = "0.4.6"
edition = "2021"
description = "Fast local Codex launcher, stdin wrapper, and slot manager"
authors = ["yupeit"]
repository = "https://github.com/xiaotianxt/cx"
license = "MIT"
keywords = ["codex", "openai", "cli", "accounts"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indicatif = "0.18"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
toml = "0.8"
